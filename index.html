<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李可喻的网盘</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.2.37/vue.global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.27.2/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader/dist/vue3-sfc-loader.js"></script>
    <link rel="prefetch" href="/assets/main.mjs">
    <link rel="prefetch" href="/assets/MimeIcon.vue">
    <link rel="stylesheet" href="/assets/main.css">
    <link rel="manifest" href="/assets/manifest.json">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <style>
        body {
            background-image: https://d8dced7c.cloudflare-leeky-tuchuang.pages.dev/file/AgACAgUAAyEGAASRyWISAAMhZ2Rmvfqz95sWaDEBR2AbLhLTz-wAAm_FMRuFfiFXdXeC0yuPo3ABAAMCAAN5AAM2BA.jpg('/assets/your-background-image.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        const { loadModule } = window["vue3-sfc-loader"];

        const options = {
            moduleCache: { vue: Vue },
            async getFile(url) {
                const res = await fetch(url);
                if (!res.ok)
                    throw Object.assign(new Error(res.statusText + " " + url), { res });
                return {
                    getContentData: (asBinary) =>
                        asBinary? res.arrayBuffer() : res.text(),
                };
            },
            addStyle(textContent) {
                const style = document.createElement("style");
                style.textContent = textContent;
                const ref = document.head.getElementsByTagName("style")[0] || null;
                document.head.insertBefore(style, ref);
            },
        };

        const app = Vue.createApp({
            components: {
                App: Vue.defineAsyncComponent(() =>
                    loadModule("/assets/App.vue", options)
                ),
            },
            template: "<App></App>",
        });

        app.mount("#app");
    </script>
    <script type="module"></script>
</body>
</html>
