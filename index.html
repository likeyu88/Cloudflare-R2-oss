<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李可喻的网盘</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.2.37/vue.global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.27.2/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader/dist/vue3-sfc-loader.js"></script>
    <link rel="prefetch" href="/assets/main.mjs">
    <link rel="prefetch" href="/assets/MimeIcon.vue">
    <link rel="stylesheet" href="/assets/main.css">
    <link rel="manifest" href="/assets/manifest.json">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <style>
        body {
            background-image: url('https://d8dced7c.cloudflare-leeky-tuchuang.pages.dev/file/AgACAgUAAyEGAASRyWISAAMhZ2Rmvfqz95sWaDEBR2AbLhLTz-wAAm_FMRuFfiFXdXeC0yuPo3ABAAMCAAN5AAM2BA.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        const { loadModule } = window["vue3-sfc-loader"];

        const options = {
            moduleCache: { vue: Vue },
            async getFile(url) {
                const res = await fetch(url);
                if (!res.ok)
                    throw Object.assign(new Error(res.statusText + " " + url), { res });
                return {
                    getContentData: (asBinary) =>
                        asBinary? res.arrayBuffer() : res.text(),
                };
            },
            addStyle(textContent) {
                const style = document.createElement("style");
                style.textContent = textContent;
                const ref = document.head.getElementsByTagName("style")[0] || null;
                document.head.insertBefore(style, ref);
            },
        };

        const app = Vue.createApp({
            components: {
                App: Vue.defineAsyncComponent(() =>
                    loadModule("/assets/App.vue", options)
                ),
            },
            template: "<App></App>",
        });

        app.mount("#app");
    </script>
    <!-- 网页鼠标点击特效 - 核心价值观关键字 -->
    <script>
        (function () {
            var a_idx = 0;
            window.onclick = function (event) {
                var a = new Array("❤富强❤", "❤民主❤", "❤文明❤", "❤和谐❤", "❤自由❤", "❤平等❤", "❤公正❤", "❤法治❤", "❤爱国❤",
                    "❤敬业❤", "❤诚信❤", "❤友善❤");
                var heart = document.createElement("b"); //创建b元素
                heart.onselectstart = new Function('event.returnValue=false'); //防止拖动

                document.body.appendChild(heart).innerHTML = a[a_idx]; //将b元素添加到页面上
                a_idx = (a_idx + 1) % a.length;
                heart.style.cssText = "position: fixed;left:-100%;"; //给p元素设置样式

                var f = 25, // 字体大小
                    x = event.clientX - f / 2 - 30, // 横坐标
                    y = event.clientY - f, // 纵坐标
                    c = randomColor(), // 随机颜色
                    a = 1, // 透明度
                    s = 1.2; // 放大缩小

                var timer = setInterval(function () { //添加定时器
                    if (a <= 0) {
                        document.body.removeChild(heart);
                        clearInterval(timer);
                    } else {
                        heart.style.cssText = "font-size:16px;cursor: default;position: fixed;color:" +
                            c + ";left:" + x + "px;top:" + y + "px;opacity:" + a + ";transform:scale(" +
                            s + ");";

                        y--;
                        a -= 0.016;
                        s += 0.002;
                    }
                }, 15)
            }
            // 随机颜色
            function randomColor() {
                return "rgb(" + (~~(Math.random() * 255)) + "," + (~~(Math.random() * 255)) + "," + (~~(Math
                 .random() * 255)) + ")";
            }
        }());
    </script>
</body>
</html>
